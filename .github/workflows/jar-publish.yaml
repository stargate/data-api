name: JAR Publish

# runs on
# * manual trigger
# * push to main branch (updates SNAPSHOT version)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# global env vars, available in all jobs and steps
env:
  MAVEN_OPTS: '-Xmx4g'
  TAAS_ARTIFACTORY_USERNAME: ${{ secrets.TAAS_ARTIFACTORY_USERNAME }}
  TAAS_ARTIFACTORY_PASSWORD: ${{ secrets.TAAS_ARTIFACTORY_PASSWORD }}

jobs:

  # builds and publishes the jar
  main:
    name: Build and Publish Jar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Setup Maven
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>stargate-central</id>
                <username>${TAAS_ARTIFACTORY_USERNAME}</username>
                <password>${TAAS_ARTIFACTORY_PASSWORD}</password>
              </server>
              <server>
                <id>stargate-snapshots</id>
                <username>${TAAS_ARTIFACTORY_USERNAME}</username>
                <password>${TAAS_ARTIFACTORY_PASSWORD}</password>
             </server>
              <server>
                <id>artifactory</id>
                <username>${TAAS_ARTIFACTORY_USERNAME}</username>
                <password>${TAAS_ARTIFACTORY_PASSWORD}</password>
              </server>
              <server>
                <id>artifactory-snapshots</id>
                <username>${TAAS_ARTIFACTORY_USERNAME}</username>
                <password>${TAAS_ARTIFACTORY_PASSWORD}</password>
              </server>
              <server>
                <id>artifactory-releases</id>
                <username>${TAAS_ARTIFACTORY_USERNAME}</username>
                <password>${TAAS_ARTIFACTORY_PASSWORD}</password>
             </server>
           </servers>
          </settings>
          EOF

      - name: Build
        run: |
          JAVA_HOME=$JAVA_21 ./mvnw -B -ntp clean package         

      - name: Publish JAR
        run: |
          JAVA_HOME=$JAVA_21 ./mvnw -B -ntp clean deploy -DskipTests